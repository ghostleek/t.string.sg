name: CI
on:
  pull_request:
  push:
    branches: [main]
# CI only reads the repo; nothing here needs a write-capable token.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: tags are mutable, SHAs are not.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
